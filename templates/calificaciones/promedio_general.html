<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Promedio general</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            color: #1f2937;
            background: #f8fafc;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        .value {
            display: block;
            margin: 20px 0;
            font-size: 48px;
            font-weight: 700;
            color: #2563eb;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Promedio general</h1>
        <span class="value">
            {% if promedio_general is not None %}
                {{ promedio_general|floatformat:2 }}
            {% else %}
                Sin datos
            {% endif %}
        </span>
        <a href="{% url 'calificaciones:listar' %}">Volver al listado</a>
    </main>
</body>
</html>
