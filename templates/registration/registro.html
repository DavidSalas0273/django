<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registrar usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 32px;
            color: #1f2937;
            background: #f8fafc;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
        }

        form p {
            display: grid;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 700;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        .helptext {
            color: #64748b;
            font-size: 14px;
        }

        ul {
            color: #64748b;
            font-size: 14px;
            padding-left: 18px;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 20px;
        }

        button,
        a {
            border-radius: 6px;
            padding: 10px 14px;
            text-decoration: none;
        }

        button {
            border: 0;
            color: #ffffff;
            background: #2563eb;
            cursor: pointer;
        }

        a {
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <h1>Registrar usuario</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Crear cuenta</button>
                <a href="{% url 'login' %}">Ya tengo cuenta</a>
            </div>
        </form>
    </main>
</body>
</html>
